<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Floating Chorded Keyboard</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #DDDDDD;
            overflow: hidden;
            font-family: sans-serif;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        /* 1️⃣ LOCKED TEXT EDITOR */
        #editor {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            bottom: 20px;
            background: white;
            border-radius: 12px;
            padding: 120px 20px 20px 120px;
            font-size: 24px;
            line-height: 1.4;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            overflow-y: hidden;
            white-space: pre-wrap;
            word-wrap: break-word;
            pointer-events: none;
            z-index: 1;
        }

        #caret {
            display: inline-block;
            width: 2px;
            height: 26px;
            background-color: #2196F3;
            vertical-align: text-bottom;
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        #kbCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        /* Floating Action Buttons */
        .btn {
            position: absolute;
            width: 46px;
            height: 46px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            pointer-events: auto;
            z-index: 20;
            transition: left 0.08s ease-out, top 0.08s ease-out;
        }

        /* 🎛️ Testing Controls Panel */
        .controls-panel {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 310px;
            max-width: 92vw;
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: rgba(255, 255, 255, 0.94);
            padding: 10px 14px;
            border-radius: 20px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.15);
            z-index: 30;
            pointer-events: auto;
            box-sizing: border-box;
        }

        .slider-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            font-size: 13px;
            font-weight: bold;
            color: #333;
        }

        .slider-label {
            width: 118px;
            flex-shrink: 0;
        }

        .slider {
            flex: 1;
            touch-action: pan-x;
            accent-color: #2196F3;
        }

        .toggle-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
            margin-top: 4px;
        }

        .toggle-btn {
            padding: 6px 10px;
            border-radius: 16px;
            border: none;
            font-size: 12px;
            font-weight: bold;
            color: #333;
            background: #E0E0E0;
            pointer-events: auto;
            white-space: nowrap;
        }

        .toggle-btn.active {
            background: #2196F3;
            color: white;
        }
    </style>
</head>
<body>

    <div id="editor"><span id="textContent"></span><span id="caret"></span></div>

    <canvas id="kbCanvas"></canvas>

    <div class="btn" id="btnSpace">␣</div>
    <div class="btn" id="btnBackspace">⌫</div>

    <!-- 🎛️ TESTING CONTROLS -->
    <div class="controls-panel">
        <div class="slider-row">
            <span class="slider-label">Circle: <span id="innerVal">45px</span></span>
            <input type="range" class="slider" id="innerSlider" min="20" max="85" step="1" value="45">
        </div>
        <div class="slider-row">
            <span class="slider-label">Ring Gap: <span id="gapVal">10px</span></span>
            <input type="range" class="slider" id="gapSlider" min="0" max="45" step="1" value="10">
        </div>
        <div class="slider-row">
            <span class="slider-label">Key Size: <span id="keyVal">22px</span></span>
            <input type="range" class="slider" id="keySlider" min="14" max="55" step="1" value="22">
        </div>
        <div class="slider-row">
            <span class="slider-label">Char Size: <span id="charVal">21px</span></span>
            <input type="range" class="slider" id="charSlider" min="12" max="48" step="1" value="21">
        </div>
        <div class="toggle-row">
            <button class="toggle-btn active" id="toggleInner">Inner: ON</button>
            <button class="toggle-btn active" id="toggleOuter">Outer: ON</button>
            <button class="toggle-btn" id="toggleBorders">Borders: OFF</button>
            <button class="toggle-btn active" id="toggleCursor">Cursor: ON</button>
            <button class="toggle-btn active" id="toggleRipple">Ripple: ON</button>
        </div>
    </div>

<script>
    // 🎛️ INDEPENDENT GEOMETRY & TYPOGRAPHY VARIABLES
    let innerRadius = 45;
    let ringGap = 10;
    let keySize = 22;
    let labelFontSize = 21;

    let mainRadius, textRadius, outerRadius;

    const numItems = 6;
    const angleStep = 360 / numItems;

    // 🌟 STATE
    let textValue = "";
    let activeTouchId = null;
    let firstFiredZone = null;
    let activeCharIndex = null;
    let fingerPos = null;
    let zoneFlashes = [];
    let cursorSparks = [];

    // 🎛️ TOGGLE STATES
    let showInnerCircle = true;
    let showOuterCircle = true;
    let showBorders = false;
    let showCursor = true;
    let showRipple = true;
    
    let kbdCenter = { x: window.innerWidth / 2, y: window.innerHeight / 2 };

    const canvas = document.getElementById('kbCanvas');
    const ctx = canvas.getContext('2d');
    const textContent = document.getElementById('textContent');
    const caret = document.getElementById('caret');
    const btnSpace = document.getElementById('btnSpace');
    const btnBackspace = document.getElementById('btnBackspace');

    const toggleInnerBtn = document.getElementById('toggleInner');
    const toggleOuterBtn = document.getElementById('toggleOuter');
    const toggleBordersBtn = document.getElementById('toggleBorders');
    const toggleCursorBtn = document.getElementById('toggleCursor');
    const toggleRippleBtn = document.getElementById('toggleRipple');

    const innerSlider = document.getElementById('innerSlider');
    const gapSlider = document.getElementById('gapSlider');
    const keySlider = document.getElementById('keySlider');
    const charSlider = document.getElementById('charSlider');

    const innerVal = document.getElementById('innerVal');
    const gapVal = document.getElementById('gapVal');
    const keyVal = document.getElementById('keyVal');
    const charVal = document.getElementById('charVal');

    // 📏 RECALCULATE DIMENSIONS
    function applyDimensions() {
        mainRadius = innerRadius + ringGap;
        textRadius = mainRadius + (keySize / 2);
        outerRadius = mainRadius + keySize;

        innerVal.textContent = `${innerRadius}px`;
        gapVal.textContent = `${ringGap}px`;
        keyVal.textContent = `${keySize}px`;
        charVal.textContent = `${labelFontSize}px`;

        updateKeyboardCenter();
    }

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        updateKeyboardCenter();
    }
    window.addEventListener('resize', resize);

    // 📍 CARET TRACKING & FLOATING BUTTON LOGIC
    function updateKeyboardCenter() {
        const rect = caret.getBoundingClientRect();
        kbdCenter = { x: rect.left, y: rect.top + (rect.height / 2) };

        const btnRadius = 23;
        const offset = (outerRadius + 28) * 0.707;

        btnSpace.style.left = (kbdCenter.x - offset - btnRadius) + 'px';
        btnSpace.style.top = (kbdCenter.y - offset - btnRadius) + 'px';
        
        btnBackspace.style.left = (kbdCenter.x + offset - btnRadius) + 'px';
        btnBackspace.style.top = (kbdCenter.y - offset - btnRadius) + 'px';
    }

    applyDimensions();
    resize();

    // 🎹 COMBO MAP
    function generateComboMap() {
        const map = new Map();
        let charCode = 97; 
        const extras = [" ", ".", "?", "!"];
        let extraIdx = 0;

        for (let i = 1; i <= 6; i++) {
            for (let j = 1; j <= 6; j++) {
                if (i !== j) {
                    if (charCode <= 122) { 
                        map.set(`${i}-${j}`, String.fromCharCode(charCode));
                        charCode++;
                    } else if (extraIdx < extras.length) {
                        map.set(`${i}-${j}`, extras[extraIdx]);
                        extraIdx++;
                    }
                }
            }
        }
        return map;
    }
    const comboMap = generateComboMap();

    // 🔄 ROTATED ZONE MAPPING (1 starts at 8 o'clock, clockwise)
    function getZoneForIndex(index) { 
        return ((index + 2) % 6) + 1; 
    }
    
    function commitText(char) {
        textValue += char;
        textContent.textContent = textValue;
        updateKeyboardCenter();
    }

    function deleteChar() {
        if (textValue.length > 0) {
            textValue = textValue.slice(0, -1);
            textContent.textContent = textValue;
            updateKeyboardCenter();
        }
    }

    // 🔍 FULL 360° HITBOX CHECK
    function getHitZoneIndex(x, y) {
        const dx = x - kbdCenter.x;
        const dy = y - kbdCenter.y;
        const distToCenter = Math.sqrt(dx * dx + dy * dy);

        if (distToCenter < mainRadius || distToCenter > outerRadius) return null;

        let angleDeg = Math.atan2(dy, dx) * 180 / Math.PI;
        if (angleDeg < 0) angleDeg += 360;

        let shiftedAngle = (angleDeg + 90) % 360;
        return Math.round(shiftedAngle / angleStep) % numItems;
    }

    // 👆 MULTI-TOUCH & PALM-REJECTION HANDLER
    function handleTouch(e) {
        let activeTouch = null;

        if (activeTouchId !== null) {
            for (let i = 0; i < e.touches.length; i++) {
                if (e.touches[i].identifier === activeTouchId) {
                    activeTouch = e.touches[i];
                    break;
                }
            }
            if (!activeTouch) {
                activeTouchId = null;
                activeCharIndex = null;
                fingerPos = null;
            }
        }

        if (activeTouchId === null) {
            for (let i = 0; i < e.touches.length; i++) {
                const t = e.touches[i];
                const hitZone = getHitZoneIndex(t.clientX, t.clientY);
                if (hitZone !== null) {
                    activeTouchId = t.identifier;
                    activeTouch = t;
                    break;
                }
            }
        }

        if (!activeTouch) return;

        fingerPos = { x: activeTouch.clientX, y: activeTouch.clientY };

        const dx = fingerPos.x - kbdCenter.x;
        const dy = fingerPos.y - kbdCenter.y;
        const distToCenter = Math.sqrt(dx * dx + dy * dy);

        // --- 1️⃣ UPPER BOUND CANCEL ---
        if (distToCenter > outerRadius) {
            activeCharIndex = null;
        }
        // --- 2️⃣ AIMING BAND ---
        else if (distToCenter > innerRadius) {
            if (distToCenter >= mainRadius) {
                activeCharIndex = getHitZoneIndex(fingerPos.x, fingerPos.y);
            }
        }
        // --- 3️⃣ FIRING LOGIC ---
        else {
            if (activeCharIndex !== null) {
                const firedZone = getZoneForIndex(activeCharIndex);
                const isCancelBtn = (firstFiredZone !== null && firedZone === firstFiredZone);
                
                const mappedChar = (firstFiredZone !== null && !isCancelBtn) 
                    ? comboMap.get(`${firstFiredZone}-${firedZone}`) 
                    : null;

                const isValidAction = isCancelBtn || firstFiredZone === null || mappedChar;

                if (isValidAction) {
                    const now = Date.now();

                    zoneFlashes.push({
                        index: activeCharIndex,
                        isCancelBtn: isCancelBtn,
                        startTime: now
                    });

                    if (showRipple) {
                        cursorSparks.push({
                            x: fingerPos.x,
                            y: fingerPos.y,
                            isCancelBtn: isCancelBtn,
                            startTime: now
                        });
                    }

                    if (firstFiredZone === null) {
                        firstFiredZone = firedZone;
                    } else {
                        if (isCancelBtn) {
                            firstFiredZone = null;
                        } else {
                            commitText(mappedChar);
                            firstFiredZone = null;
                        }
                    }
                }
                activeCharIndex = null;
            }
        }
    }

    function isUiControl(target) {
        return Boolean(target.closest('.btn, .controls-panel'));
    }

    document.addEventListener('touchstart', (e) => {
        if (isUiControl(e.target)) return;
        e.preventDefault();
        handleTouch(e);
    }, {passive: false});

    document.addEventListener('touchmove', (e) => {
        if (isUiControl(e.target)) return;
        e.preventDefault(); 
        handleTouch(e);
    }, {passive: false});

    document.addEventListener('touchend', (e) => {
        if (isUiControl(e.target)) return;
        e.preventDefault();
        handleTouch(e);
    }, {passive: false});

    document.addEventListener('touchcancel', (e) => {
        handleTouch(e);
    }, {passive: false});

    // Floating Action Buttons
    btnSpace.addEventListener('touchstart', (e) => {
        e.preventDefault();
        e.stopPropagation();
        commitText(" ");
    }, {passive: false});
    
    btnBackspace.addEventListener('touchstart', (e) => {
        e.preventDefault();
        e.stopPropagation();
        deleteChar();
    }, {passive: false});

    // 🎛️ Slider Listeners
    innerSlider.addEventListener('input', (e) => {
        innerRadius = parseInt(e.target.value, 10);
        applyDimensions();
    });

    gapSlider.addEventListener('input', (e) => {
        ringGap = parseInt(e.target.value, 10);
        applyDimensions();
    });

    keySlider.addEventListener('input', (e) => {
        keySize = parseInt(e.target.value, 10);
        applyDimensions();
    });

    charSlider.addEventListener('input', (e) => {
        labelFontSize = parseInt(e.target.value, 10);
        applyDimensions();
    });

    // 🎛️ Toggle Listeners
    toggleInnerBtn.addEventListener('touchstart', (e) => {
        e.preventDefault();
        e.stopPropagation();
        showInnerCircle = !showInnerCircle;
        toggleInnerBtn.textContent = `Inner: ${showInnerCircle ? 'ON' : 'OFF'}`;
        toggleInnerBtn.classList.toggle('active', showInnerCircle);
    }, {passive: false});

    toggleOuterBtn.addEventListener('touchstart', (e) => {
        e.preventDefault();
        e.stopPropagation();
        showOuterCircle = !showOuterCircle;
        toggleOuterBtn.textContent = `Outer: ${showOuterCircle ? 'ON' : 'OFF'}`;
        toggleOuterBtn.classList.toggle('active', showOuterCircle);
    }, {passive: false});

    toggleBordersBtn.addEventListener('touchstart', (e) => {
        e.preventDefault();
        e.stopPropagation();
        showBorders = !showBorders;
        toggleBordersBtn.textContent = `Borders: ${showBorders ? 'ON' : 'OFF'}`;
        toggleBordersBtn.classList.toggle('active', showBorders);
    }, {passive: false});

    toggleCursorBtn.addEventListener('touchstart', (e) => {
        e.preventDefault();
        e.stopPropagation();
        showCursor = !showCursor;
        toggleCursorBtn.textContent = `Cursor: ${showCursor ? 'ON' : 'OFF'}`;
        toggleCursorBtn.classList.toggle('active', showCursor);
    }, {passive: false});

    toggleRippleBtn.addEventListener('touchstart', (e) => {
        e.preventDefault();
        e.stopPropagation();
        showRipple = !showRipple;
        toggleRippleBtn.textContent = `Ripple: ${showRipple ? 'ON' : 'OFF'}`;
        toggleRippleBtn.classList.toggle('active', showRipple);
    }, {passive: false});

    // 🎨 HELPER TO FILL A 60° KEY WEDGE
    function fillKeyWedge(cx, cy, index, fillStyle) {
        const startRad = ((index * angleStep) - 90 - (angleStep / 2)) * Math.PI / 180;
        const endRad = ((index * angleStep) - 90 + (angleStep / 2)) * Math.PI / 180;

        ctx.beginPath();
        ctx.arc(cx, cy, outerRadius, startRad, endRad, false);
        ctx.arc(cx, cy, mainRadius, endRad, startRad, true);
        ctx.closePath();
        ctx.fillStyle = fillStyle;
        ctx.fill();
    }

    // 🎨 RENDER LOOP
    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const cx = kbdCenter.x;
        const cy = kbdCenter.y;
        const now = Date.now();

        // 1️⃣ COLOR-FILLED KEY HIGHLIGHTS
        for (let i = 0; i < numItems; i++) {
            const zone = getZoneForIndex(i);
            const isAnchor = (zone === firstFiredZone);
            const isActive = (i === activeCharIndex);

            if (isAnchor && isActive) {
                fillKeyWedge(cx, cy, i, 'rgba(255, 152, 0, 0.85)');
            } else if (isAnchor) {
                fillKeyWedge(cx, cy, i, 'rgba(76, 175, 80, 0.85)');
            } else if (isActive) {
                fillKeyWedge(cx, cy, i, 'rgba(33, 150, 243, 0.75)');
            }
        }

        // 2️⃣ FIRED KEY FLASHES
        zoneFlashes = zoneFlashes.filter(flash => {
            const age = now - flash.startTime;
            if (age > 250) return false;
            const alpha = (1 - age / 250) * 0.7;
            const color = flash.isCancelBtn
                ? `rgba(255, 152, 0, ${alpha})`
                : `rgba(76, 175, 80, ${alpha})`;
            fillKeyWedge(cx, cy, flash.index, color);
            return true;
        });

        // 3️⃣ OPTIONAL INNER BLUE CIRCLE
        if (showInnerCircle) {
            ctx.beginPath();
            ctx.arc(cx, cy, innerRadius, 0, Math.PI * 2);
            ctx.strokeStyle = '#2196F3';
            ctx.lineWidth = Math.max(3, Math.min(6, innerRadius * 0.1));
            ctx.stroke();
        }

        // 4️⃣ OPTIONAL KEY BORDERS
        if (showBorders) {
            ctx.strokeStyle = 'rgba(128, 128, 128, 0.6)';
            ctx.lineWidth = 2;

            ctx.beginPath();
            ctx.arc(cx, cy, mainRadius, 0, Math.PI * 2);
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(cx, cy, outerRadius, 0, Math.PI * 2);
            ctx.stroke();

            for (let i = 0; i < numItems; i++) {
                const dividerRad = ((i * angleStep) - 90 - (angleStep / 2)) * Math.PI / 180;
                ctx.beginPath();
                ctx.moveTo(cx + Math.cos(dividerRad) * mainRadius, cy + Math.sin(dividerRad) * mainRadius);
                ctx.lineTo(cx + Math.cos(dividerRad) * outerRadius, cy + Math.sin(dividerRad) * outerRadius);
                ctx.stroke();
            }
        }

        // 5️⃣ OPTIONAL OUTER BOUNDING CIRCLE
        if (showOuterCircle) {
            ctx.beginPath();
            ctx.arc(cx, cy, outerRadius, 0, Math.PI * 2);
            ctx.strokeStyle = '#2196F3';
            ctx.lineWidth = Math.max(2, Math.min(4, innerRadius * 0.08));
            ctx.stroke();
        }

        // 6️⃣ DRAW CHARACTERS ONLY AFTER FIRST STROKE
        if (firstFiredZone !== null) {
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.font = `bold ${labelFontSize}px sans-serif`;

            for (let i = 0; i < numItems; i++) {
                const zone = getZoneForIndex(i);
                const isAnchor = (zone === firstFiredZone);
                const isActive = (i === activeCharIndex);

                const angleRad = ((i * angleStep) - 90) * Math.PI / 180;
                const textX = cx + Math.cos(angleRad) * textRadius;
                const textY = cy + Math.sin(angleRad) * textRadius;

                if (isAnchor) {
                    if (isActive) {
                        ctx.fillStyle = '#FFFFFF';
                        ctx.fillText('✕', textX, textY);
                    }
                    continue;
                }

                const mappedChar = comboMap.get(`${firstFiredZone}-${zone}`);
                if (!mappedChar) continue;

                const displayChar = mappedChar === ' ' ? '␣' : mappedChar;
                ctx.fillStyle = isActive ? '#FFFFFF' : '#000000';
                ctx.fillText(displayChar, textX, textY);
            }
        }

        // 7️⃣ OPTIONAL RIPPLE EFFECT
        if (showRipple) {
            cursorSparks = cursorSparks.filter(spark => {
                const age = now - spark.startTime;
                if (age > 300) return false;

                const p = age / 300;
                const currentRadius = 24 + (60 - 24) * p;
                const alpha = 1 - p;
                
                const r = spark.isCancelBtn ? 255 : 76;
                const g = spark.isCancelBtn ? 152 : 175;
                const b = spark.isCancelBtn ? 0 : 80;

                ctx.beginPath();
                ctx.arc(spark.x, spark.y, currentRadius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${alpha * 0.4})`;
                ctx.fill();

                ctx.beginPath();
                ctx.arc(spark.x, spark.y, currentRadius, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(${r}, ${g}, ${b}, ${alpha})`;
                ctx.lineWidth = 6;
                ctx.stroke();

                return true;
            });
        } else {
            cursorSparks = [];
        }

        // 8️⃣ OPTIONAL FINGER TRACKING CURSOR
        if (showCursor && fingerPos) {
            ctx.beginPath();
            ctx.arc(fingerPos.x, fingerPos.y, 24, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(33, 150, 243, 0.3)';
            ctx.fill();
            
            ctx.beginPath();
            ctx.arc(fingerPos.x, fingerPos.y, 6, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
            ctx.fill();

            ctx.beginPath();
            ctx.arc(fingerPos.x, fingerPos.y, 24, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(33, 150, 243, 0.8)';
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        requestAnimationFrame(draw);
    }

    requestAnimationFrame(draw);
</script>
</body>
</html>
